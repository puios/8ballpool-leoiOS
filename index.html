<style>
body {
  margin: 0;
  background-color: white;
  color: black;
  font-family: 'Mali', sans-serif;
  transition: background-color 0.4s, color 0.4s;
}
body.dark-mode {
  background-color: #2f2f2f;
  color: #e0e0e0;
}

/* Spinner loading */
#loadingScreen {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 11000;
}
#loadingSpinner {
  width: 60px;
  height: 60px;
  position: relative;
}
#loadingSpinner div {
  transform-origin: 30px 30px;
  animation: loadingSpinnerAnim 1.2s linear infinite;
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  top: 27px;
  left: 27px;
}
@keyframes loadingSpinnerAnim {
  0%, 20%, 100% { opacity: 1; }
  80% { opacity: 0.2; }
}
#loadingSpinner div:nth-child(n) {
  transform: rotate(calc((var(--i) - 1) * 30deg)) translate(0, -22px);
  animation-delay: calc(-1.2s + (var(--i) * 0.1s));
}

#topBar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10001;
}

/* VIDEO */
.video-container {
  width: 75%;
  margin: 48px auto 20px auto;
  position: relative;
}
.video-container img {
  width: 100%;
  display: block;
  cursor: pointer;
}

/* ICON PLAY */
.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 90px;
  color: white;
  text-shadow: 0 0 20px black;
  pointer-events: none;
}

/* BUTTON */
.button-group {
  display: flex;
  justify-content: center;
  margin-top: 30px;
  margin-bottom: 30px;
}
.button-group a {
  background: #ff0066;
  color: white;
  padding: 26px 60px;
  border-radius: 18px;
  font-size: 30px;
  font-family: 'Mali', sans-serif;
  text-decoration: none;
  transition: all 0.2s ease;
  box-shadow: 0 0 12px #ff0066;
}
.button-group a:hover {
  box-shadow: 0 0 25px #ff0066;
  transform: translateY(-3px);
}

/* MOBILE: đẩy ảnh xuống */
@media (max-width: 768px) {
  .video-container {
    margin-top: 80px;
  }
}

/* ADS */
.blurred {

  pointer-events: none;
}
.overlay-ad {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 10px;
  z-index: 9999;
  display: none;

}
.overlay-ad img {

}
.close-btn {

  background: red;
  color: white;
  border: none;
  padding: 3px 8px;
  font-size: 14px;
}
#overlayBlock {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: none;
}
</style>
</head>
