<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Link Tải Hack PU IOS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mali&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background-color: white;
  color: black;
  font-family: 'Mali', sans-serif;
  transition: background-color 0.4s, color 0.4s;
}
body.dark-mode {
  background-color: #2f2f2f;
  color: #e0e0e0;
}

/* ===== LOADING ===== */
#loadingScreen {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 11000;
}
#loadingSpinner {
  width: 60px;
  height: 60px;
  position: relative;
}
#loadingSpinner div {
  transform-origin: 30px 30px;
  animation: loadingSpinnerAnim 1.2s linear infinite;
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  top: 27px;
  left: 27px;
}
@keyframes loadingSpinnerAnim {
  0%, 20%, 100% { opacity: 1; }
  80% { opacity: 0.2; }
}
#loadingSpinner div:nth-child(n) {
  transform: rotate(calc((var(--i) - 1) * 30deg)) translate(0, -22px);
  animation-delay: calc(-1.2s + (var(--i) * 0.1s));
}

/* ===== TOP BAR ===== */
#topBar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10001;
}

/* ===== VIDEO ===== */
.video-container {
  width: 75%;
  margin: 48px auto 20px auto;
  position: relative;
}
.video-container img {
  width: 100%;
  display: block;
  cursor: pointer;
}

/* PLAY ICON */
.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 90px;
  color: white;
  text-shadow: 0 0 20px black;
  pointer-events: none;
}

/* ===== BUTTON ===== */
.button-group {
  display: flex;
  justify-content: center;
  margin-top: 40px;
  margin-bottom: 30px;
}
.button-group a {
  background: #ff0066;
  color: white;
  padding: 26px 60px;      /* TO HƠN */
  border-radius: 18px;
  font-size: 30px;         /* CHỮ TO */
  font-family: 'Mali', sans-serif;
  text-decoration: none;
  transition: all 0.2s ease;
  box-shadow: 0 0 18px #ff0066;
}
.button-group a:hover {
  box-shadow: 0 0 30px #ff0066;
  transform: translateY(-3px);
}
.button-group a:active {
  transform: scale(1.1);
}

/* ===== BLUR ADS ===== */
.blurred {
  filter: blur(6px);
  pointer-events: none;
}
.overlay-ad {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 10px;
  z-index: 9999;
  display: none;
  width: 60vw;
}
.overlay-ad img {
  width: 100%;
}
.close-btn {
  cursor: pointer;
  background: red;
  color: white;
  border: none;
  padding: 3px 8px;
  font-size: 14px;
}
#overlayBlock {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: none;
}
</style>
</head>

<body>

<div id="loadingScreen">
  <div id="loadingSpinner">
    <div style="--i:1"></div><div style="--i:2"></div><div style="--i:3"></div>
    <div style="--i:4"></div><div style="--i:5"></div><div style="--i:6"></div>
    <div style="--i:7"></div><div style="--i:8"></div><div style="--i:9"></div>
    <div style="--i:10"></div><div style="--i:11"></div><div style="--i:12"></div>
  </div>
</div>

<h1 style="display:none;">🔥Hack 8 Ball Pool Free IOS🔥</h1>

<div id="main-content" style="display:none;">
  <div class="video-container" id="videoContainer">
    <img src="fakevideo.jpg" id="fakeVideo">
    <i class="fa-solid fa-play play-icon"></i>

    <!-- CHỈ CÒN 1 NÚT -->
    <div class="button-group">
      <a href="https://drive.google.com/file/d/14Cot6riUZyJPT9tJ6I2VFPkumd80DzZ7/view" target="_blank">
        🔥 FILE HACK IOS 🔥
      </a>
    </div>
  </div>
</div>

<!-- ADS -->
<div class="overlay-ad" id="adBox">
  <button class="close-btn" id="closeAd">X</button>
  <img src="quangcao.jpg">
</div>
<div id="overlayBlock"></div>

<script>
window.addEventListener("load", () => {

/* CLICK ẢNH → YOUTUBE (KHÔNG CÒN LỖI TRANG) */

closeAd.onclick = () => {

</script>

</body>
</html>
