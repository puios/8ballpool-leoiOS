<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Hack 8 Ball Pool IOS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mali&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#fff;
  color:#000;
  font-family:'Mali',sans-serif;
}
body.dark-mode{
  background:#2f2f2f;
  color:#eee;
}

/* ===== LOADING ===== */
#loadingScreen{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:11000;
}
#loadingSpinner{
  width:60px;height:60px;
  position:relative;
}
#loadingSpinner div{
  position:absolute;
  width:6px;height:6px;
  background:#333;
  border-radius:50%;
  top:27px;left:27px;
  transform-origin:30px 30px;
  animation:spin 1.2s linear infinite;
}
@keyframes spin{
  0%,20%,100%{opacity:1}
  80%{opacity:.2}
}
#loadingSpinner div:nth-child(n){
  transform:rotate(calc((var(--i) - 1) * 30deg)) translate(0,-22px);
  animation-delay:calc(-1.2s + (var(--i)*.1s));
}

/* ===== TOP BAR ===== */
#topBar{
  position:fixed;
  top:10px;left:10px;right:10px;
  display:flex;
  gap:12px;
  z-index:10001;
}
.switch{
  width:120px;height:60px;
}
.switch input{display:none}
.slider{
  position:relative;
  width:100%;height:100%;
  background:#ccc;
  border-radius:60px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:44px;height:44px;
  background:#fff;
  border-radius:50%;
  top:8px;left:8px;
  transition:.3s;
}
input:checked + .slider{
  background:#444;
}
input:checked + .slider:before{
  transform:translateX(60px);
}

/* ===== TITLE ===== */
h1{
  margin-top:120px;
  text-align:center;
  color:red;
  font-size:46px;
}

/* ===== VIDEO ===== */
.video-container{
  width:75%;
  margin:40px auto;
  position:relative;
}
.video-container img{
  width:100%;
  display:block;
  cursor:pointer;
  border-radius:12px;
}

/* PLAY ICON */
.play-icon{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:90px;
  color:white;
  text-shadow:0 0 20px black;
  pointer-events:none;
  opacity:.85;
}
.video-container:hover .play-icon{
  transform:translate(-50%,-50%) scale(1.15);
  opacity:1;
}

/* ===== BUTTON ===== */
.button-group{
  display:flex;
  justify-content:center;
  margin:40px 0;
}
.button-group a{
  background:#ff0066;
  color:white;
  padding:26px 60px;
  font-size:30px;
  border-radius:20px;
  text-decoration:none;
  box-shadow:0 0 18px #ff0066;
  transition:.2s;
}
.button-group a:hover{
  transform:translateY(-4px);
  box-shadow:0 0 30px #ff0066;
}
.button-group a:active{
  transform:scale(1.1);
}

/* ===== BLUR ADS ===== */
.blurred{
  filter:blur(6px);
  pointer-events:none;
}
.overlay-ad{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:10px;
  z-index:9999;
  display:none;
  width:60vw;
}
.overlay-ad img{width:100%}
.close-btn{
  background:red;
  color:white;
  border:none;
  padding:4px 10px;
  cursor:pointer;
}
#overlayBlock{
  position:fixed;
  inset:0;
  z-index:9998;
  display:none;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div id="loadingSpinner">
    <div style="--i:1"></div><div style="--i:2"></div><div style="--i:3"></div>
    <div style="--i:4"></div><div style="--i:5"></div><div style="--i:6"></div>
    <div style="--i:7"></div><div style="--i:8"></div><div style="--i:9"></div>
    <div style="--i:10"></div><div style="--i:11"></div><div style="--i:12"></div>
  </div>
</div>

<!-- TOP BAR -->
<div id="topBar" style="display:none">
  <label class="switch">
    <input type="checkbox" id="modeToggle">
    <span class="slider"></span>
  </label>
</div>

<h1 style="display:none">🔥 Hack 8 Ball Pool IOS 🔥</h1>

<div id="main-content" style="display:none">

  <div class="video-container" id="videoContainer">
    <img src="fakevideo.jpg" id="fakeVideo">
    <i class="fa-solid fa-play play-icon"></i>

    <div class="button-group">
      <a href="https://drive.google.com/file/d/14Cot6riUZyJPT9tJ6I2VFPkumd80DzZ7/view" target="_blank">
        🔥 FILE HACK IOS 🔥
      </a>
    </div>
  </div>

</div>

<!-- ADS -->
<div class="overlay-ad" id="adBox">
  <button class="close-btn" id="closeAd">X</button>
  <img src="quangcao.jpg">
</div>
<div id="overlayBlock"></div>

<script>
window.addEventListener("load",()=>{
  setTimeout(()=>{
    loadingScreen.style.display="none";
    topBar.style.display="flex";
    document.querySelector("h1").style.display="block";
    mainContent.style.display="block";
  },500);
});

/* DARK MODE */
if(localStorage.dark=="1"){
  document.body.classList.add("dark-mode");
  modeToggle.checked=true;
}
modeToggle.onchange=()=>{
  document.body.classList.toggle("dark-mode");
  localStorage.dark=modeToggle.checked?"1":"0";
};

/* CLICK IMAGE -> YOUTUBE */
fakeVideo.onclick=()=>{
  window.open("https://www.youtube.com/@PUiOSss","_blank");
};

/* ADS */
setTimeout(()=>{
  adBox.style.display="block";
  videoContainer.classList.add("blurred");
  overlayBlock.style.display="block";
},1300);

closeAd.onclick=()=>{
  window.open("https://vt.tiktok.com/ZSHtXajUXBFDN-bqkDz/","_blank");
  adBox.style.display="none";
  videoContainer.classList.remove("blurred");
  overlayBlock.style.display="none";
};
</script>

</body>
</html>
